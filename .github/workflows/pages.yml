name: pages

on:
  push:
    branches: [main]
    paths-ignore: ["scripts/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_PROJECT_REPO: ${{ github.repository }}
          VITE_API_BASE: ${{ vars.API_BASE }} # empty = https://cdn.ivx.run/applesec/api
          # "Sign In" is only built when all three are set (see vite.config.ts).
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_CLIENT_ID: ${{ vars.SUPABASE_CLIENT_ID }}
          VITE_IAM_URL: ${{ vars.IAM_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
