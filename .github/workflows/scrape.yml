name: scrape

on:
  schedule:
    - cron: "0 0 * * 0" # weekly
  workflow_dispatch: # run by hand after creating an analysis repo to refresh the "analyzed" flags

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: scripts/pyproject.toml

      - name: Scrape Apple advisories + NVD
        working-directory: scripts
        run: uv run main.py --out out/api
        env:
          ANALYSIS_ORG: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}

      # Any S3-compatible bucket works; for Cloudflare R2 the endpoint is https://<account-id>.r2.cloudflarestorage.com
      - name: Publish to the CDN bucket
        run: |
          for name in RCLONE_CONFIG_CDN_ENDPOINT S3_BUCKET RCLONE_CONFIG_CDN_ACCESS_KEY_ID RCLONE_CONFIG_CDN_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name is empty. Set the repository variables S3_ENDPOINT and S3_BUCKET and the repository secrets S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY (Settings → Secrets and variables → Actions, not inside an environment)."; exit 1; }
          done
          curl -fsSL -o rclone.zip https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip
          unzip -qj rclone.zip '*/rclone' && rm rclone.zip

          dest="cdn:$S3_BUCKET/$S3_PREFIX"
          # Only files whose content changed are uploaded (--checksum compares MD5s with the bucket's);
          # files no longer produced are deleted. The index goes last, so it never points at files not uploaded yet.
          ./rclone sync scripts/out/api "$dest" --exclude /index.json --checksum --fast-list \
            --transfers 32 --checkers 64 --header-upload "Cache-Control: public, max-age=3600" --stats-one-line -v
          ./rclone copyto scripts/out/api/index.json "$dest/index.json" --header-upload "Cache-Control: no-cache" -v
        env:
          # Read from either tab, so it works whether they were saved as variables or secrets.
          S3_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX || 'applesec/api' }}
          RCLONE_CONFIG_CDN_TYPE: s3
          RCLONE_CONFIG_CDN_PROVIDER: Cloudflare # also fine for other S3-compatible storage
          RCLONE_CONFIG_CDN_ENDPOINT: ${{ vars.S3_ENDPOINT || secrets.S3_ENDPOINT }}
          RCLONE_CONFIG_CDN_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_CDN_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_CDN_NO_CHECK_BUCKET: "true" # the token can write objects but needn't list or create buckets
