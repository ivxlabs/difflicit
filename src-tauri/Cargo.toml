[package]
name = "difflicit"
version = "0.0.0" # the app version comes from package.json (see tauri.conf.json)
description = "Difflicit: patch diffing and analysis for CVEs"
authors = ["ivx research (Vikrant Singh Chauhan)"]
license = "GPL-3.0-only"
repository = "https://github.com/ivxlabs/difflicit"
edition = "2024"
rust-version = "1.90"

[lib]
name = "difflicit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
futures-util = "0.3"
getrandom = "0.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1"
similar = "2"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros", "sync"] }
tokio-tungstenite = "0.24"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
